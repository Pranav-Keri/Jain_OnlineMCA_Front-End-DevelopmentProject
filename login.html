<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - VideshiYatra</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="style.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .login-box {
            max-width: 400px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-custom">
        <a class="navbar-brand" href="index.html">VideshiYatra</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavDropdown">
          <span class="navbar-toggler-icon"></span>
        </button></nav>
<div class="container">

    <div class="login-box">

        <h2 class="text-center mb-4">Login</h2>

        <form id="loginForm">

            <div class="form-group">
                <label>Email ID</label>
                <input type="email" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-dark btn-block">
                Login
            </button>

            <p class="text-center mt-3">
                Don't have an account?
                <a href="register.html">Register</a>
            </p>

        </form>

    </div>

</div>

<script>
document.getElementById('loginForm').addEventListener('submit', function(event) {

    event.preventDefault();

    alert("Login Successful!");

});
</script>

    <script src="script.js"></script>

<footer class="bg-dark text-white text-center p-4">

    <h5>VideshiYatra</h5>

    <div class="mb-3">
        <a href="#" class="text-white"><i class="bi bi-instagram mx-2"></i></a>
        <a href="#" class="text-white"><i class="bi bi-facebook mx-2"></i></a>
        <a href="#" class="text-white"><i class="bi bi-twitter-x mx-2"></i></a>
    </div>

    <p>© 2024 VideshiYatra. All Rights Reserved.</p>

</footer>
</body>
</html>
